services:
  - type: web
    name: stock-discord-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 10000
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: CHECK_INTERVAL_SECONDS
        value: 60
      - key: ALERT_COOLDOWN_MINUTES
        value: 60
